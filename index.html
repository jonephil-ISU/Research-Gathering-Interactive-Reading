<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gathering Evidence: Interactive Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--orange:#C1440E;--bg:#F6F7FA;--card:#fff;--ink:#1A1A1A;--muted:#5B6577;--line:#D9DEE8;--ok:#1F7A4D;--okbg:#E7F5EE;--bad:#B3261E;--badbg:#FCEBEA;--peach:#FBE3D6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',Calibri,Arial,sans-serif;line-height:1.6;font-size:17px}
header{background:var(--navy);color:#fff;padding:22px 16px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{font-family:'Space Grotesk',sans-serif;margin:0;font-size:26px;line-height:1.2}
header p{margin:4px 0 0;color:#C9D3E3;font-size:15px}
.progress{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.dot{flex:1 1 0;min-width:28px;height:8px;border-radius:4px;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.cur{background:var(--orange)}
.plabel{font-size:14px;color:var(--muted);margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;margin-bottom:18px}
.chip{display:inline-block;background:var(--orange);color:#fff;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:5px;margin-bottom:8px}
h2{font-family:'Space Grotesk',sans-serif;font-size:27px;line-height:1.2;margin:0 0 14px;color:var(--navy)}
h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:22px 0 6px;color:var(--navy)}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin-bottom:6px}
ol li::marker{font-weight:700;color:var(--navy)}
ol.roadmap li{margin-bottom:16px}
ol.roadmap li>ul{margin-top:10px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px}
.compare div{border-radius:10px;padding:12px 14px;font-size:16px}
.thin{background:#EEF1F6}
.det{background:var(--peach)}
.compare b{display:block;font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.thin b{color:var(--muted)}.det b{color:var(--orange)}
.example{border:2px solid var(--navy);border-radius:12px;padding:14px 16px 6px;margin:18px 0;background:#fff}
.example .tag{display:inline-block;background:var(--navy);color:#fff;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:5px;margin-bottom:8px}
.example .why{background:#EEF1F6;border-radius:8px;padding:8px 12px;font-size:15px;margin:0 0 12px}
.goes{background:#EEF1F6;border-radius:10px;padding:12px 14px;font-size:15px;margin:16px 0 0}
.goes b{color:var(--navy)}
.callout{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;margin:14px 0}
.callout.big{background:var(--orange);font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:1.25;text-align:center;padding:22px 18px}
.def{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px;background:#FCFCFD}
.def b{color:var(--navy)}
.def i{color:var(--muted)}
.check{margin-top:26px;border-top:2px solid var(--line);padding-top:6px}
.q{margin:18px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font:16px 'IBM Plex Sans',sans-serif;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt:disabled{cursor:default}
.fb{font-size:15px;border-radius:8px;padding:9px 12px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#14502F}
.fb.no{background:var(--badbg);color:#7A1913}
.write{background:#FFF8F3;border:1.5px solid #F2C9B5;border-radius:12px;padding:14px 16px;margin-top:22px}
.write h3{margin:0 0 4px;color:var(--orange)}
.write textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:9px;padding:11px;font:16px 'IBM Plex Sans',sans-serif;resize:vertical;background:#fff}
.write textarea:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.wc{font-size:14px;color:var(--muted);margin-top:4px}
.wc.ok{color:var(--ok);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 40px;flex-wrap:wrap}
.btn{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:12px 22px;font:600 16px 'IBM Plex Sans',sans-serif;cursor:pointer}
.btn:disabled{background:#B9C0CC;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.lockmsg{font-size:14px;color:var(--muted);flex:1;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font:17px 'IBM Plex Sans',sans-serif}
input[type=text]:focus{outline:2px solid var(--orange);border-color:var(--orange)}
label.l{font-weight:600;display:block;margin-bottom:6px}
.sumrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;gap:16px;font-size:16px}
.sumrow span:last-child{color:var(--ok);font-weight:600;flex-shrink:0}
.hidden{display:none}
#printView{display:none}
@media(max-width:600px){.compare{grid-template-columns:1fr}.panel{padding:18px 16px}h2{font-size:23px}}
@media print{
 body{background:#fff;font-size:11pt}
 header,#app,.progress,.plabel{display:none!important}
 #printView{display:block!important}
 #printView h1{font-size:20pt;color:#0B1F3A;margin:0 0 4px}
 .pv-meta{font-size:11pt;margin-bottom:12px}
 .pv-sec{margin-bottom:12px;border:1px solid #999;padding:8px 10px}
 .pv-sec h4{margin:0 0 4px;font-size:12pt}
 .pv-q{font-size:10.5pt;margin:4px 0;break-inside:avoid}
 .pv-q i{color:#333}
 .pv-w{break-after:avoid;page-break-after:avoid}
 .pv-sec h4{break-after:avoid;page-break-after:avoid}
 .pv-r{font-size:10.5pt;margin:8px 0 4px;padding:6px 8px;border:1px solid #bbb;white-space:pre-wrap;break-inside:avoid}
 .pv-attest{margin-top:14px;font-size:11pt;border-top:2px solid #000;padding-top:8px}
}
</style>
</head>
<body>
<header><div class="wrap"><h1>Gathering Evidence</h1><p>TGE 1150 · Module 4 · Week 2 · Interactive Reading</p></div></header>
<div class="wrap" id="app">
  <div class="progress" id="progress"></div>
  <div class="plabel" id="plabel"></div>
  <div id="stage"></div>
</div>
<div class="wrap" id="printView"></div>

<script>
var SECTIONS = [
{id:'start',title:'Start Here',kind:'start'},
{id:"big",chip:"Section A: The Big Idea",title:"Evidence turns a complaint into a case",
body:"<p>Last week you worked out who you are convincing and what they care about. This week you go get proof.</p>\n<p>Picture Dani walking up to Ray, the shop owner, and saying, \"The lift is always busy.\" Ray does not say yes. Ray says, \"How do you know?\"</p>\n<p>That question is the whole week. A <b>complaint</b> is something you feel. A <b>case</b> is something you can show. Ray cannot approve a $5,300 machine because Dani is frustrated. He can approve it if Dani shows him that the problem is real, that it keeps happening, what it costs, and what other people who have dealt with it say.</p>\n<h3>The three jobs this week</h3>\n<ol>\n<li><b>Lock in your target.</b> Pull your ask and your problem over from Week 1, so everything you gather has something to prove.</li>\n<li><b>Name the pattern.</b> Figure out the real pattern behind your problem and find out what it is actually called.</li>\n<li><b>Gather evidence in three rounds.</b> Round One proves the problem is recognized. Round Two is hard numbers. Round Three is real voices from people who have used this kind of equipment.</li>\n</ol>\n<h3>Two rules for this week</h3>\n<ul>\n<li><b>Every source is real and has a working link.</b> If you cannot link to it, you cannot use it.</li>\n<li><b>Nothing is generated for you.</b> You do the thinking and the searching. AI can help you search, but it cannot be your source. No AI-made sources, no made-up quotes, no summaries written by a tool.</li>\n</ul>\n<p>Dani keeps going through every section as the example. Dani is made up, and so are the numbers. Your own work will use your own field and your own facts.</p>\n<p>This interactive reading explains what each part of the Week 2 worksheet is asking and what a strong answer looks like. You do the actual research on the worksheet. Fill the worksheet out as you really do the research, not after.</p>",
goes:"Your research this week feeds the Introduction, the Review of Literature, and the Methodology. Your Conclusion is still yours to write in Week 3.",
qs:[
 {q:"Dani says, \"The lift is always busy.\" Ray asks, \"How do you know?\" What does Dani need most?",o:["A longer story about how frustrating the busy days feel for everyone in the shop", "A lower price on the machine so there is less for Ray to argue about", "Real sources and numbers that show the problem is real and keeps happening", "A coworker standing next to Dani who will say the same thing to Ray"],c:2,hint:"Think about the difference between a complaint and a case.",why:"A case is something you can show. Ray needs proof, not frustration."},
 {q:"What are the three jobs this week?",o:["Pick a supplier, negotiate a price, and place the order for the equipment", "Write the Introduction, the Conclusion, and the References page of the proposal", "Lock in your target, name the pattern behind the problem, and gather evidence in three rounds", "Interview your supervisor, rewrite your Week 1 answers, and build a slide deck"],c:2,hint:"See the list under \"The three jobs this week.\"",why:"Target, pattern, then three rounds of evidence."},
 {q:"Which of these counts as a source in this course?",o:["A summary of the topic that an AI tool wrote for you in a few seconds", "A page you actually opened and read, with a working link you can share", "A claim you remember reading somewhere but cannot find again", "A seller's ad that says its machine is the best one on the market"],c:1,hint:"Look at the two rules for this week.",why:"Every source needs a real, working link, and nothing is generated for you."},
 {q:"Where does the research you do this week end up?",o:["It is only practice, and Week 3 starts over with brand new research", "It goes straight into the Conclusion, which an AI helps you write in Week 3", "It stays on the worksheet and never shows up in the final proposal", "It feeds the Introduction, the Review of Literature, and the Methodology"],c:3,hint:"Read the \"Where this goes\" box.",why:"The research feeds three sections. The Conclusion is still yours."}
],
write:{prompt:"Write your Week 1 ask in one sentence. Then write your complaint: what you feel about the problem. Next, write your case: what you could show a supervisor to prove the problem is real and keeps happening.",min:0,use:"Read First, What This Worksheet Is For"}},

{id:"s1",chip:"Section B: Step 1",title:"Lock in your target",
body:"<p>Step 1 on the Week 2 Research Worksheet is where you bring two things over from Week 1: your <b>one-sentence ask</b> and your <b>problem with the incident that proves it</b>.</p>\n<p>Why bother? Because this is your target. Every source you gather this week has to help prove this specific ask. If you cannot see how a source connects back to the target, it does not belong in your research, no matter how interesting it is.</p>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 1</span>\n<p><b>Ask:</b> \"I am asking you to approve a second lift for about $5,300.\"</p>\n<p><b>Problem:</b> \"Last Tuesday our only lift was down for six hours. We turned away four jobs at about $160 each, roughly $640 in one day.\"</p>\n<p>While searching, Dani finds a good article about how tire pressure sensors work on electric vehicles. It is interesting. But it says nothing about a shop running out of lift time, so it does not serve the target. Dani leaves it out.</p>\n<div class=\"why\">Why it works: the target is specific enough that Dani can test every source against it. A vague target lets everything in.</div></div>\n<h3>Doing this well</h3>\n<ul>\n<li>Copy your ask and your problem exactly as you wrote them in Week 1.</li>\n<li>Keep the ask to one sentence that names the exact item and the decision you need.</li>\n<li>If your Week 1 ask was vague, like \"better equipment,\" tighten it now. A vague target gets vague research.</li>\n<li>Keep the number from your incident. You will need it again later.</li>\n<li>If you work in your industry, use a real incident. If you do not have experience yet, imagine a realistic one in your industry.</li>\n</ul>",
goes:"Your target is the filter for everything else this week. Each source has to serve this ask.",
qs:[
 {q:"Why do you copy your Week 1 ask and problem into the Week 2 worksheet?",o:["It gives your instructor a quick way to check that you finished Week 1", "Everything you gather this week has to serve this specific ask", "It lets you change your mind about the problem before you start", "The worksheet cannot be downloaded unless those boxes are filled in"],c:1,hint:"Read the paragraph that starts \"Why bother?\"",why:"The target is the filter. A source that does not serve it does not belong."},
 {q:"Dani finds an article about tire pressure sensors on electric vehicles. It is interesting but says nothing about running out of lift time. What should Dani do?",o:["Use it anyway, because more sources always make a case look stronger", "Change the ask so that the article seems to fit the target better", "Leave it out, because it does not connect to the ask or the problem", "Save it for the Conclusion, where it can add something extra"],c:2,hint:"Look at the \"Watch it work\" box.",why:"Interesting is not the same as useful. It has to serve the target."},
 {q:"Which version of the ask is ready to carry into Week 2?",o:["I am asking you to approve a second lift for about $5,300", "I think the shop could really use some newer equipment in the near future", "I want to talk about better ways to handle the work in the shop", "Please consider updating our equipment so that we can serve customers better"],c:0,hint:"Which one names the exact item and the decision?",why:"A ready ask names the item, the price, and the decision."},
 {q:"Your Week 1 ask was \"better equipment for the shop.\" What should you do before you start searching?",o:["Keep it vague, because the research will make it clear later on", "Wait until you find a product, then rewrite the ask to match that product", "Tighten it so it names the exact item and the decision you need", "Replace it with a longer ask that covers several different purchases"],c:2,hint:"See the \"Doing this well\" list.",why:"A vague target gets vague research. Tighten it first."}
],
write:{prompt:"Write your ask and your problem as they stand. Note anything vague that needs tightening and the number from your incident you will carry forward.",min:0,use:"Step 1, Lock In Your Target"}},

{id:"q1",chip:"Quick Concept",title:"What is a theoretical framework, and why does it matter?",
body:"<p>A <b>theoretical framework</b> is the named pattern behind your problem. It is the idea that explains why your problem is real, why it keeps happening, and why your ask makes sense.</p>\n<h3>Why it matters</h3>\n<ul>\n<li><b>It turns a complaint into a pattern.</b> Without one, a supervisor can wave off each incident as a bad day or a rare fluke. With one, the incidents become a single problem that is real and ongoing.</li>\n<li><b>It gives your proposal a backbone.</b> The framework shapes how you present your evidence. It tells the reader what to look for in everything that follows.</li>\n<li><b>It shows you did your homework.</b> You did not make up a reason. You found a real concept, from a real source, that fits your facts.</li>\n<li><b>It makes you harder to argue with.</b> When someone asks \"why do you think this is the cause?\", you have a named idea and a source to point to.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani</span>\n<p><b>Without a framework:</b> \"The lift is always busy.\"</p>\n<p><b>With a framework:</b> \"This is a bottleneck. According to the Theory of Constraints, a system can only produce as much as its slowest step allows. Our one lift is the slowest step.\"</p>\n<div class=\"why\">Why it works: the second version names the pattern and points to a source, so Ray has something to evaluate instead of a feeling to dismiss.</div></div>\n<h3>Where it shows up</h3>\n<p>It becomes the Theoretical Framework section of your proposal. It also shapes your Review of Literature and the way the rest of your research is organized.</p>\n",
goes:"Everything you gather in Rounds One to Three exists to prove this specific pattern is real.",
qs:[{"q": "What is a theoretical framework?", "o": ["A long list of every problem you have noticed at work", "A short summary of the product you want your supervisor to buy", "A named pattern behind your problem that explains why it keeps happening", "A set of rules your supervisor gives you for writing the proposal"], "c": 2, "hint": "Read the first paragraph of the page.", "why": "It is the named pattern behind your problem."}, {"q": "Why is a pattern stronger than a list of complaints?", "o": ["It makes the proposal longer, which supervisors like", "It turns separate incidents into one real, ongoing problem", "It lets you skip gathering evidence later on", "It means you no longer need to name an ask"], "c": 1, "hint": "See \"It turns a complaint into a pattern.\"", "why": "A supervisor can wave off one bad day, but not a named pattern."}, {"q": "Dani says \"the lift is always busy.\" What does a framework add?", "o": ["A louder way of saying the same thing", "A lower price for the machine", "A named idea with a source that explains why it happens", "A list of other shops that own the same machine"], "c": 2, "hint": "Compare the two versions in the example.", "why": "The framework gives a named idea and a source, so there is something to evaluate."}, {"q": "Where does the framework show up in your proposal?", "o": ["Only in the Conclusion, where you sum things up", "As its own Theoretical Framework section, and it shapes your Review of Literature", "Nowhere, because it is only a worksheet exercise", "Only in the references list at the end"], "c": 1, "hint": "See \"Where it shows up.\"", "why": "It is its own section and it shapes how the rest of the research is organized."}]
},
{id:"s2a",chip:"Section C: Step 2, Part 1",title:"Find the pattern yourself",
body:"<p>Step 2 builds your <b>theoretical framework</b>. The Quick Concept page explained what it is and why it matters. Now you start building yours.</p>\n<p>Part 1 is where you find that pattern yourself, before you look anything up. The worksheet asks four questions.</p>\n<ol>\n<li><b>What is actually changing on the work side?</b> Think about the work itself: job length, volume, materials. Not the symptom you are seeing.</li>\n<li><b>What has stayed exactly the same on the equipment side?</b></li>\n<li><b>Did this build up over time, or hit all at once? How do you know?</b> Point to a specific moment, not a feeling that it got worse.</li>\n<li><b>If nothing changes, does this resolve on its own, or does it keep happening? Why?</b></li>\n</ol>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 2 Part 1</span>\n<p><b>Work side:</b> \"Winter tire season starts in October and our work doubles.\"</p>\n<p><b>Equipment side:</b> \"We still have one 15-year-old lift. It takes about 50 minutes per job and is booked about six hours a day. That has not changed.\"</p>\n<p><b>Built up or all at once:</b> \"It builds every season. Last year we were backed up almost every Saturday from October to January.\"</p>\n<p><b>Resolve on its own?</b> \"No. The lift does not gain capacity between busy weeks, so the next busy week overflows the same way.\"</p>\n<div class=\"why\">Why it works: Dani points to real moments and numbers, and the answers line up into one picture. The work grew and the equipment did not.</div></div>\n<div class=\"compare\"><div class=\"thin\"><b>Symptom (weak)</b>\"The lift keeps going down.\"</div><div class=\"det\"><b>Change in the work (strong)</b>\"Jobs double every winter, and the lift stays the same size.\"</div></div>\n<h3>Doing this well</h3>\n<ul>\n<li>Describe a change in the work itself, not just the thing that annoys you.</li>\n<li>Name what stayed fixed on the equipment side, with numbers if you can.</li>\n<li>Point to a specific moment when you or others noticed it.</li>\n<li>Explain whether it keeps happening and why.</li>\n</ul>",
goes:"This does not get its own section in the paper. It sets up the pattern that Part 2 gives a name to, and that your Review of Literature explains.",
qs:[
 {q:"Which of these is a change on the work side?",o:["The lift is fifteen years old and has not been replaced", "Jobs double every winter when tire season starts", "The lift takes about fifty minutes to finish one job", "Ray has turned down earlier equipment requests from the crew"],c:1,hint:"Work side means the work itself: volume, job length, materials.",why:"The amount of work changed. The lift and Ray did not."},
 {q:"Dani writes \"The lift keeps going down\" for the work-side question. Why is that weak?",o:["It is too short to count as a full answer on the worksheet", "It names a symptom instead of a change in the work itself", "It blames the equipment, and the worksheet never allows that", "It should have named the brand of the lift that keeps failing"],c:1,hint:"Compare the weak and strong boxes.",why:"A symptom is what you see. The pattern is what changed underneath it."},
 {q:"Dani answers the build-up question with \"it just feels like it got worse.\" What is missing?",o:["A specific moment, like when people started noticing or when it was flagged", "A longer answer that uses bigger words so it sounds professional", "A quote from Ray saying he agrees the problem has gotten worse", "A comparison to how other shops in town handle the same problem"],c:0,hint:"See the third question, \"Did this build up over time?\"",why:"Point to a real moment, not a feeling."},
 {q:"Why does the worksheet ask whether the problem resolves on its own or keeps happening?",o:["It is the question that decides which framework the worksheet gives you", "A problem that keeps happening is ongoing, not a one-time fluke", "It lets you skip the evidence rounds if the answer is that it resolves on its own", "Supervisors only approve requests for problems that happen every single day"],c:1,hint:"Think about what Ray could say about a one-time problem.",why:"Ongoing problems are worth solving. Flukes are easy to dismiss."},
 {q:"Dani's answers show the work doubled while the lift stayed the same. What does that combination point to?",o:["A mismatch between what the work demands and what the equipment can handle", "A pricing problem, because the shop is charging too little per job", "A training problem, because the techs are working too slowly on the lift", "A scheduling problem that Ray could solve by changing the shop hours"],c:0,hint:"Look at the \"Watch it work\" box.",why:"Demand grew and capacity stayed fixed, so the two no longer match."}
],
write:{prompt:"Jot down quick notes on each of the four pattern questions. For each one, note the moment or number you would use to back it up.",items:["What is changing on the work side","What has stayed the same on the equipment side","Whether it built up over time or hit all at once","Whether it resolves on its own or keeps happening"],min:0,use:"Step 2, Build Your Theoretical Framework (the pattern questions)"}},

{id:"s2b",chip:"Section D: Step 2, Part 2",title:"Name the concept",
body:"<p>Part 2 asks you to go find out <b>what your pattern is actually called</b>. This named pattern becomes the <b>Theoretical Framework</b> section of your research proposal. It is the idea behind your whole argument, and it shapes how you present your evidence. This is a real concept, found in a textbook, a course reading, a credible article, or a professional field. You are <b>naming</b> a concept. You are not inventing one.</p>\n<h3>How to find your framework</h3>\n<p>Follow these steps in order. Use your own pattern and problem each time.</p>\n<ol class=\"roadmap\">\n<li><b>Start with your pattern.</b> Open your notes from Section C. Write your pattern as one short phrase. For Dani: \"demand grows but one machine stays the same.\"</li>\n<li><b>Pull out the key words.</b> Circle the two or three words that carry the idea, like \"demand,\" \"one machine,\" or \"slows.\" These are your search words.</li>\n<li><b>Add a framework word and search.</b> Take your key words and add one of these words: <i>theory</i>, <i>model</i>, <i>framework</i>, or <i>concept</i>. Then type it into a search bar. Try two or three versions.<br><b>Watch it work: Dani.</b> Dani's key words are <i>demand</i>, <i>one machine</i>, and <i>slows</i>. Dani tries:<ul><li>one machine slows production <b>theory</b></li><li>demand grows limited capacity <b>model</b></li><li>why does one machine slow down a whole shop <b>framework</b></li></ul>Dani's second search leads to a page about the Theory of Constraints. That is the name Dani was looking for.<br><b>Your turn:</b> Write your key words, add <i>theory</i>, <i>model</i>, or <i>framework</i>, and search.</li>\n<li><b>Ask AI for leads, not answers.</b> Ask: \"What established theories or models explain [your pattern] in [your workplace]?\" AI gives you names to search. It is not your source. Take each name and find where it really comes from.<br><b>Watch it work: Dani.</b> \"What established theories or models explain <i>[demand outgrowing one machine]</i> in <i>[a car repair shop]</i>?\"<br><b>Your turn:</b> Fill in the blanks with your own pattern and workplace.</li>\n<li><b>Find the real source.</b> Look for a textbook, a course reading, a university page, or a professional or trade organization. Your ISU library search and Google Scholar also work. Follow the page back to the real person, book, or field.<br><b>Start here:</b> <a href=\"https://isu.libguides.com/informationliteracy/findarticles\" target=\"_blank\" rel=\"noopener\">ISU Library: Find Articles</a> or <a href=\"https://scholar.google.com/\" target=\"_blank\" rel=\"noopener\">Google Scholar</a></li>\n<li><b>Test the fit.</b> Finish this sentence: \"[Concept] says ____, and that explains why ____ at my workplace.\" If you cannot finish it, the concept does not fit. Go back to step 3 and try another.<br><b>Watch it work: Dani.</b> \"<i>[The Theory of Constraints]</i> says <i>[a system can only produce as much as its slowest step allows]</i>, and that explains why <i>[our shop can only finish as many jobs as the one lift allows]</i>.\"<br><b>Your turn:</b> Finish the sentence with your own concept and workplace.</li>\n<li><b>Save it.</b> Save the link now by pasting it into the notes box below. That way you can copy and paste it into your worksheet later. Read the source well enough to explain it in your own words. If your supervisor asked \"where did you get that?\", you should be able to say who it is from, what it says, and why you trust them.</li>\n</ol>\n<p><b>Look at two or three possible frameworks before you choose.</b> The first one you find is rarely the best fit.</p>\n<h3>The five answers the worksheet wants</h3>\n<ol>\n<li><b>The name of the concept.</b></li>\n<li><b>Where it comes from.</b> A researcher, field, textbook, or course material you would trust. On the worksheet this has four boxes: the source title and author or publisher, the link, where you found it, and what kind of source it is. You should be able to explain what it says and why you trust who wrote it.</li>\n<li><b>Why it fits your case.</b> Use your own facts from Part 1.</li>\n<li><b>Another way to read the same facts</b>, and why you ruled it out.</li>\n<li><b>What someone would have to show you to prove the framework does not apply.</b></li>\n</ol>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 2 Part 2</span>\n<p><b>Concept:</b> \"Theory of Constraints.\"</p>\n<p><b>Where it comes from:</b> \"Eliyahu Goldratt's book <i>The Goal</i>. It says a system can only produce as much as its slowest step allows. I also read the link to a university page that explains it.\"</p>\n<p><b>Why it fits:</b> \"Our one lift is the slowest step. Every job has to pass through it, so the whole shop can only finish as many jobs as the lift allows.\"</p>\n<p><b>Another reading:</b> \"You could call this a staffing problem. I ruled it out because our techs are already standing around waiting for the lift, so more people would not fix it.\"</p>\n<p><b>What would prove it wrong:</b> \"If the lift sat empty for hours each day and jobs still stacked up, the lift would not be the real limit.\"</p>\n<div class=\"why\">Why it works: Dani names a real concept, traces it to a real source, ties it to real facts from the shop, and says honestly what would break the idea.</div></div>\n<div class=\"callout\">If you cannot name a real researcher, field, or source your concept traces back to, you have not found the real concept yet. You have made one up. Keep looking.</div>",
goes:"This is the Theoretical Framework. It shapes your Review of Literature and the way the rest of your research is organized.",
qs:[
 {q:"What is Part 2 asking you to do?",o:["Invent a short, catchy name for your pattern so that it is easy to remember", "Pick the product that you think would solve the pattern the best", "Find the real name of the pattern from a textbook, reading, or credible source", "Ask your supervisor to tell you what the pattern is called"],c:2,hint:"Read the first paragraph under Part 2.",why:"You are naming a real concept, not inventing one."},
 {q:"Dani cannot name a researcher, field, or source for a concept. What does that tell Dani?",o:["The concept may be made up, so Dani needs to keep looking", "The concept is probably too advanced for a proposal like this one", "The concept is fine as long as it sounds right to the reader", "The source is not important as long as the facts are true"],c:0,hint:"See the orange-and-navy callout at the end of the section.",why:"If you cannot trace it to a real source, you have not found it yet."},
 {q:"Dani rules out \"a staffing problem.\" What fact does Dani use?",o:["Techs are already waiting around for the lift, so more people would not help", "The shop cannot afford to hire anyone new before the winter season starts", "Ray has said more than once that he does not want to hire more people", "Staffing is not a real concept, so it cannot be used as an explanation"],c:0,hint:"Look at \"Another reading\" in the example.",why:"A real fact from the shop is what rules the alternative out."},
 {q:"Why does the worksheet ask what someone would have to show you to prove your framework wrong?",o:["It gives the reader a reason to doubt the rest of your research", "It makes the answer longer so it looks more complete", "It shows you know what facts would have to be true for your idea to hold up", "It lets you skip the evidence rounds when you cannot think of an answer"],c:2,hint:"Read Dani's answer about the lift sitting empty.",why:"Knowing what would break your idea shows you understand it."},
 {q:"Which is the best way to start searching for the name of your pattern?",o:["Search for the brand name of the equipment you want to buy", "Pull the key words out of your pattern and search for the concept behind it", "Type your whole Week 1 ask into a search bar and read the first result", "Ask an AI tool to name a concept and use whatever it gives you"],c:1,hint:"See \"How to find your framework.\"",why:"Key words plus \"concept\" or \"theory\" is the way in. Then follow it to a real source."}
],
write:{prompt:"Jot down quick notes on each of these.",items:["Your pattern, described in your own words", "Three words or phrases you could search to find out what your pattern is called", "One other explanation someone could give, and the fact that rules it out", "The link to your source (paste it here). If you found a couple of possible frameworks, paste a link for each one."],min:0,use:"Step 2, Build Your Theoretical Framework (naming the concept)"}},

{id:"q2",chip:"Quick Concept",title:"Three kinds of sources",
body:"<p>Before you go find sources, you need to know what each round is looking for. There are three kinds, one for each round.</p>\n<h3>1. Sources that describe the problem (Round One)</h3>\n<ul>\n<li><b>What they are:</b> Industry guidance, trade articles, and reports that describe the problem and how people in the industry deal with it or get past it.</li>\n<li><b>Dani:</b> <i>[A trade association article on how shops plan for the seasonal rush.]</i></li>\n<li><b>Why it matters:</b> It proves the problem is more than one person's complaint, and it shows what others do about it.</li>\n</ul>\n<h3>2. Quantitative sources (Round Two)</h3>\n<ul>\n<li><b>What they are:</b> Numbers. This is where you will find spec sheets for different products. Cost, speed, capacity, and warranty length are all things you can measure and compare.</li>\n<li><b>Dani:</b> <i>[\"The BendPak XPR-10AS takes 45 seconds to full rise.\"]</i> Dani found this on a manufacturer spec sheet.</li>\n<li><b>Why it matters:</b> Numbers show the size of the problem and the difference each product makes. Spec sheets are the seller's own numbers, so look for a second source to check them.</li>\n</ul>\n<h3>3. Qualitative sources (Round Three)</h3>\n<ul>\n<li><b>What they are:</b> People's experiences. What people say, describe, or report from using the equipment or living with the problem. Reviews, forum posts, interviews.</li>\n<li><b>Dani:</b> A BendPak owner on the Garage Journal forum wrote: <i>[\"i've had zero issues with it\"]</i></li>\n<li><b>Why it matters:</b> Voices show what it is actually like to live with, which numbers cannot.</li>\n</ul>\n<h3>Why you need all three</h3>\n<p>Each one answers a question your supervisor will ask. The problem sources answer \"Is this really a problem?\" The numbers answer \"How much will it help?\" The voices answer \"Will it work for people like us?\" If one is missing, there is a gap in your case.</p>\n",
goes:"Round One finds the problem sources, Round Two finds the quantitative sources, and Round Three finds the qualitative sources. Knowing the difference tells you what to look for in each.",
qs:[{"q": "Which of these is a quantitative source?", "o": ["A tech says the machine is a pain to calibrate", "A shop owner says a second lift changed their Saturdays", "A reviewer calls it the best machine they have ever used", "A spec sheet says the machine runs full rise in 45 seconds"], "c": 3, "hint": "Quantitative means numbers you can measure.", "why": "Forty-five seconds is a measurement. The rest are what people say."}, {"q": "Which of these is a qualitative source?", "o": ["The machine costs $3,900", "The warranty lasts three years", "A shop owner on a forum describes how a second lift changed their Saturdays", "Each job takes 18 minutes"], "c": 2, "hint": "Qualitative means experience, in people's own words.", "why": "A person describing what it was like is experience, not a measurement."}, {"q": "A trade association article on how shops plan for the seasonal rush belongs in which round?", "o": ["Round One, because it describes the problem and how the industry deals with it", "Round Two, because it is full of facts and numbers", "Round Three, because a person wrote it", "Nowhere, because articles are never sources"], "c": 0, "hint": "See the first kind of source above.", "why": "It documents the problem and what others do about it, which is Round One."}, {"q": "Why does a strong case need all three kinds of sources?", "o": ["Using all three is the only way to make the proposal longer", "Each one answers a different question your supervisor will ask", "The problem sources are required, and the others only get added if there is space", "Voices matter most, so the numbers and problem sources are for decoration"], "c": 1, "hint": "See \"Why you need all three.\"", "why": "The problem sources, numbers, and voices answer different questions, so together they make a stronger case."}, {"q": "Dani writes \"most techs love this machine.\" Which round does it belong in?", "o": ["Round Two, because the word most counts as a number", "Round Three, because it is what people say, not a measured number", "Round One, because it shows the problem is recognized", "Nowhere, because opinions are never evidence"], "c": 1, "hint": "See the third kind of source above.", "why": "It is people's experience, so it is qualitative and belongs in Round Three."}]
},
{id:"s3",chip:"Section E: Step 3",title:"Round One: finding the problem",
body:"<p>Round One has one job: find sources that show your problem is a <b>recognized issue in your industry</b>, not something you are imagining. You are not looking for the product yet. This week you find and save the sources. In Week 3 you open each one and dig into what it says.</p><h3>Use your framework to guide your search</h3><p>Your framework is the lens for everything you find from here on. Pull the key words from your framework and pattern, and use them in your searches. A source does not have to name your framework. It just has to be about the same kind of problem.</p><div class=\"example\"><span class=\"tag\">Watch it work: Dani</span><p>Dani's framework is the Theory of Constraints. Dani searches <i>[bottleneck]</i>, <i>[limited capacity]</i>, and <i>[auto repair shop]</i>. A trade association page on planning for seasonal demand never says \"Theory of Constraints,\" but it is about the same problem. It fits.</p></div>\n<p>Think about it from Ray's side. \"Dani says the lift is a bottleneck\" is one person's view. \"A trade association publishes guidance on planning for seasonal demand\" is the industry saying it is a real thing. That turns a shop complaint into a documented necessity.</p>\n<h3>Why this round matters</h3><p>Your supervisor will ask one question first: is this a real problem, or just your opinion? These sources are your answer. Each one shows that people outside your workplace recognize the same problem. They become the proof behind your proposal, so the quality of what you save here matters.</p>\n<h3>What counts here</h3>\n<ul>\n<li><b>Strong:</b> regulations, standards bodies, trade association guidance, industry reports, and professional training materials.</li>\n<li><b>Weak:</b> a page where no person is named, or where you cannot find out what the writer does in the trade. You cannot tell who is speaking or whether they know the work.</li>\n</ul>\n<h3>How to find your sources</h3>\n<ol class=\"roadmap\">\n<li><b>Write your problem in one sentence.</b> Use your notes from earlier. Dani: <i>[one lift limits how many jobs the shop can finish]</i>.</li>\n<li><b>Ask who would write about it.</b> Who in your industry cares about this problem? Trade associations, trade magazines and journals, certification and training bodies, equipment makers, and safety or licensing agencies all publish on problems like this. Dani lists an automotive service trade association and a trade magazine for repair shops.</li>\n<li><b>Search with a source word added.</b> Take your framework and problem key words and add <i>guidance</i>, <i>standard</i>, <i>report</i>, or <i>best practices</i>. Dani tries <i>[bottleneck auto repair shop capacity]</i> <b>guidance</b>.<ul><li><b>Look where your trade talks.</b> Search your trade association, trade magazines, and certification or training bodies by name.</li><li><b>Check for articles and reports too.</b> <a href=\"https://scholar.google.com/\" target=\"_blank\" rel=\"noopener\">Google Scholar</a> and the <a href=\"https://isu.libguides.com/informationliteracy/findarticles\" target=\"_blank\" rel=\"noopener\">ISU Library</a> may turn up something useful. If you find little, that is normal for a trade, so keep going with the trade sources.</li><li><b>If you use AI,</b> check every link yourself. AI sometimes makes up links. Click each one and make sure it opens a real page that says what you expect.</li></ul></li>\n<li><b>Do a quick check before you save.</b> Who wrote it, and what do they do in the trade? Is it recent? Does it explain the problem? Use the list above.</li>\n<li><b>Save the link now.</b> Paste it into your notes right away so you can copy it into the worksheet later. Save a few extra options so you can choose the best ones.</li>\n</ol>\n<h3>What the worksheet asks for each source</h3>\n<ul>\n<li>The title and publisher.</li>\n<li>A working link.</li>\n<li>Where you found it.</li>\n<li>What kind of source it is.</li>\n</ul>\n<p>You need at least two sources, and one more answer: what else did you look at and rule out, and why did these win? That shows you compared real options and did not just click the first two results. If you find more, the worksheet has a button to add more sources.</p>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 3</span>\n<p><b>Source 1:</b> \"Tire Shop Spring Preparation: Gear Up for the Busy Season,\" by Matt White, Director of Tire Services at the Tire Industry Association, published on Autosphere.</p>\n<p><b>Link:</b> <a href=\"https://autosphere.ca/tires/2026/05/06/tire-shop-spring-preparation-gear-up-for-the-busy-season/\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://autosphere.ca/tires/2026/05/06/tire-shop-spring-preparation-gear-up-for-the-busy-season/</a></p>\n<p><b>Where found:</b> \"I searched 'planning for seasonal demand tire shops' and followed a result to a trade magazine article.\"</p>\n<p><b>Kind of source:</b> \"Trade association article.\"</p>\n<p><b>Source 2:</b> \"Preparing and Planning for Winter,\" a column by Diane Freeman, Executive Director of the Automotive Aftermarket Retailers of Ontario, published on Autosphere.</p>\n<p><b>Link:</b> <a href=\"https://autosphere.ca/mechanical/2021/09/16/preparing-and-planning-for-winter/\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://autosphere.ca/mechanical/2021/09/16/preparing-and-planning-for-winter/</a></p>\n<p><b>Where found:</b> \"I searched 'preparing tire shop seasonal changeover' and followed a result to a column on the same trade site.\"</p>\n<p><b>Kind of source:</b> \"Trade association column.\"</p>\n<p><b>Ruled out:</b> \"A tire shop blog post about busy seasons. I skipped it because no person was named, so I could not tell who wrote it or what they do in the trade.\"</p>\n<div class=\"why\">Why it works: both sources are independent of any seller and come from people who speak for the trade. Dani can say exactly where each was found, and the rule-out shows Dani looked at more than two results. Dani will dig into what the articles say in Week 3.</div></div>\n<h3>Doing this well</h3>\n<ul>\n<li>Get at least two real sources, each with a working link.</li>\n<li>Note where you found each one and what kind of source it is.</li>\n<li>Pick sources that connect to the pattern from Step 2.</li>\n<li>Name at least one source you looked at and ruled out, and say why.</li>\n</ul>\n",
goes:"Round One sources and your framework feed the Review of Literature in your final proposal.",
qs:[{"q": "What is Round One trying to find?", "o": ["Sources showing the machine you want is cheaper than every other machine", "Sources showing the problem is a recognized issue in your industry", "Sources showing your supervisor already agrees with you", "Sources showing the equipment you have now is broken"], "c": 1, "hint": "Read the first paragraph of the section.", "why": "Round One documents the problem. The product comes later."}, {"q": "Which source is strongest to look for in Round One?", "o": ["A video ad that promises the machine will double the shop's output", "A post from a customer who says they had a long wait one time", "The product page for the machine Dani wants the shop to buy", "A trade association guide on planning for seasonal shop demand"], "c": 3, "hint": "See \"What counts here.\"", "why": "Trade association guidance is independent and recognized in the industry."}, {"q": "Which of these does the worksheet ask you to save for each Round One source?", "o": ["A summary of every page of the source", "A quote from the source that proves your point", "The title and publisher, the link, where you found it, and what kind of source it is", "What the author stands to gain from the source"], "c": 2, "hint": "See \"What the worksheet asks for each source.\"", "why": "This week you find and save the source. You dig into what it says in Week 3."}, {"q": "What does \"what else did you look at and rule out, and why did these win?\" check?", "o": ["That you picked the most popular sources on the first page of results", "That you compared real options instead of clicking the first two results", "That you can find sources that disagree with the pattern you named", "That you ruled out every source from a company that sells equipment"], "c": 1, "hint": "See the paragraph about the extra answer.", "why": "It shows you compared real options."}],
write:{prompt:"List the kinds of sources you will look for and the search words you will try. Name one kind you will rule out and why.",min:0,use:"Step 3, Round One"}},

{id:"s4",chip:"Section F: Step 4",title:"Round Two: finding the numbers",
body:"<p>Round Two is <b>quantitative</b> data. That means numbers: cost, specs, capacity, speed, warranty length, anything you can measure about the equipment. This round is strictly numbers. Opinions and reviews wait for Round Three. Round Two compares two different brands of the same type of product, like two two-post lifts from two makers.</p>\n<p>This week you find at least two options and the sources that have their numbers. You are not pulling the numbers out yet. In Week 3 you open each source, put the numbers side by side, and decide which option you lean toward.</p>\n<p>The worksheet asks, for each source, for the product, brand, and model, a working link, where you found it, and what kind of source it is. Then it asks what else you found and why these won.</p>\n<h3>Where to look</h3>\n<ul>\n<li>Manufacturer websites and spec sheets.</li>\n<li>Retailer and supplier listings.</li>\n<li>Trade publications and independent tests that compare equipment.</li>\n<li><b>Videos that show the numbers.</b> A tech or shop owner timing a job on camera, or a walkthrough of a machine's specs and cost. Check who is speaking and what they do in the trade.</li>\n</ul>\n<h3>Rules for good sources</h3>\n<ul>\n<li><b>Pick two brands of the same type of product.</b> The same kind of machine from two different makers. These become the two options you give your supervisor in Week 3, where you compare them and say which one is best. For both options, collect price and the same three measures that matter most for your product, such as speed, capacity, durability, upkeep, or warranty. Do not pair a bare machine with a bundle that has extras.</li>\n<li><b>A seller's page is good, but not alone.</b> A manufacturer or seller page is a good source for what a product does and what it costs. It cannot be your only source, because anyone selling something has a reason to tell you that you need it. Pair it with an independent source, like an independent test.</li>\n<li><b>Pick sources that connect to your problem.</b> A spec only matters if it connects to the pattern you named.</li>\n<li><b>Keep opinions out.</b> If you catch yourself looking for \"people say it is great,\" that belongs in Round Three.</li>\n<li><b>Save the video link and note who is speaking.</b> Copy the link to the video, not the channel, and write the speaker's name and role. In Week 3 you will watch it and pull out what they say.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 4</span>\n<p><b>Option 1:</b> BendPak XPR-10AS two-post lift. <b>Link:</b> saved and checked. <b>Where found:</b> \"I searched 'BendPak XPR-10AS spec sheet' and opened the manufacturer's PDF.\" <b>Kind of source:</b> \"Manufacturer spec sheet.\"</p>\n<p><b>Option 2:</b> Rotary SPOA10 two-post lift. <b>Link:</b> saved and checked. <b>Where found:</b> \"Searched 'Rotary SPOA10 cutsheet' and opened the Rotary spec sheet.\" <b>Kind of source:</b> \"Manufacturer spec sheet.\"</p>\n<p><b>Note to self:</b> \"Both are the sellers' own numbers. I also looked for an independent test of each lift and listed what I found.\"</p>\n<div class=\"why\">Why it works: both options can be compared, each source is named, and Dani looked for an independent check on each one.</div></div>\n<h3>Doing this well</h3>\n<ul>\n<li>Use at least two brands of the same type of product, each with a working link.</li>\n<li>Note where you found each one and what kind of source it is.</li>\n<li>Choose sources that have numbers tied to your problem.</li>\n<li>Keep opinions and reviews out of this round.</li>\n</ul>\n",
goes:"Round Two sources become the quantitative evidence for your Methodology in the final proposal.",
qs:[{"q": "Which of these belongs in Round Two?", "o": ["A spec sheet that lists price, time to full rise, and warranty length", "A forum post where a tech says the machine is a pain to calibrate", "A review that calls it the best machine the writer has ever used", "An interview with a shop owner about how happy the crew has been"], "c": 0, "hint": "Round Two is strictly numbers.", "why": "Price, time, and warranty are measurable. The rest are opinions."}, {"q": "One machine is priced alone and the other as a bundle with extra tools. What should Dani do?", "o": ["Use both, since the seller picked those prices", "Pick the bundle because getting extras always makes the price a better deal", "Skip price and use only the machines with the most features", "Pick two brands of the same type of machine, so they can be compared"], "c": 3, "hint": "See \"Pick two brands of the same type of product.\"", "why": "A fair comparison starts with options that can be compared."}, {"q": "Why should Dani note that a spec sheet comes from the manufacturer?", "o": ["They are the seller's own numbers, so a second source may be needed to check them", "It makes the numbers look more official so that Ray is more likely to trust them", "Spec sheets are the only place where anyone is allowed to find the numbers", "It is a rule that every number has to be followed by the name of a company"], "c": 0, "hint": "See \"A seller's page is good, but not alone.\"", "why": "Knowing the source helps you check it later."}, {"q": "What do you do with the numbers in Round Two this week?", "o": ["Pull them out and decide which option wins", "Find the sources that have them and save the links, then pull the numbers out in Week 3", "Skip them and write about how the machines feel to use", "Wait until you have a seller to ask for the numbers"], "c": 1, "hint": "Read the second paragraph of the section.", "why": "This week you find and save. Week 3 is where you dig in."}, {"q": "Dani writes \"the techs I talked to love this machine\" while looking for Round Two sources. Where does it belong?", "o": ["Round Three, because it is an opinion and not a number", "Round Two, because it supports the machine Dani leans toward", "Round One, because it shows the problem is recognized in the industry", "Nowhere, because what other people think does not count as evidence"], "c": 0, "hint": "Read the \"Keep opinions out\" bullet under \"Rules for good sources.\"", "why": "Opinions and experiences belong in Round Three."}],
write:{prompt:"Name the two brands of the product you plan to compare and the kinds of numbers you hope their sources will have. Note where you will look.",min:0,use:"Step 4, Round Two"}},

{id:"s5",chip:"Section G: Step 5",title:"Round Three: finding real voices",
body:"<p>Round Three is <b>qualitative</b> data. That means real experience: reviews, forum posts, interviews, and accounts from people who have actually worked with this kind of equipment. Round Two will tell Ray what the machine does on paper. Round Three tells him what it is like to live with.</p>\n<p>This week you find the voices and save where they came from. Find voices about each of your two Round Two options. Source 1 is about your Option 1 brand, and Source 2 is about your Option 2 brand. In Week 3 you open each one and dig into what they said.</p>\n<p>The key word is <b>independent</b>. You need voices that are not selling you anything. A glowing description on the seller's own site is marketing, not a review.</p>\n<h3>Where to look</h3>\n<ul>\n<li>Trade forums and communities where working techs talk to each other.</li>\n<li>Verified buyer reviews on sites that are not the seller's.</li>\n<li>A real interview or conversation with someone who has used the equipment, like a tech, a service manager, or an instructor.</li>\n<li><b>Videos from people in your trade.</b> A tech or shop owner talking about using the equipment in a real shop. Someone in your industry who names who they are and what they do counts as a voice.</li>\n</ul>\n<h3>Ask who is speaking</h3>\n<p>A shop foreman with ten years of experience is different from an anonymous account with one post. Note who the voice is, so your reader knows how much weight to give it. In Week 3 you will also ask what each voice stands to gain or lose.</p>\n<p>The worksheet asks for the source name or person, a working link or a note about who you talked to, how you found it, and who is speaking. It also asks what else you found and why these won. If you found a vendor page pretending to be a review, name it there and explain why you did not use it.</p>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 5</span>\n<p><b>Source 1:</b> The Garage Journal thread Two-post Lifts: Rotary vs. Bendpak, a reply by a BendPak owner. <b>Link:</b> saved and checked. <b>How found:</b> \"I searched for 'Rotary vs Bendpak two post lift.'\" <b>Who is speaking:</b> \"A forum member who owns a 10,000 lb BendPak lift.\"</p>\n<p><b>Source 2:</b> A conversation with the service manager at another shop. <b>Note:</b> name and date written down. <b>How found:</b> \"A contact at a local shop introduced us.\" <b>Who is speaking:</b> \"A service manager with ten years of experience.\"</p>\n<p><b>Ruled out:</b> \"A five-star testimonial on the seller's own site. The seller picks which ones to show.\"</p>\n<div class=\"why\">Why it works: the voices are independent, Dani knows who each one is, and the rule-out shows Dani could tell marketing from experience.</div></div>\n<h3>Doing this well</h3>\n<ul>\n<li>Find at least two independent voices, each with a working link or a clear note about who you talked to.</li>\n<li>Note how you found each one and who is speaking.</li>\n<li>Name any vendor material you ruled out and say why.</li>\n<li>For a video, save the link to the video, not the channel, and note the speaker's name and role.</li>\n</ul>\n",
goes:"Round Three sources become the qualitative evidence for your Methodology in the final proposal.",
qs:[{"q": "Which counts as an independent voice?", "o": ["A testimonial printed on the seller's own product page", "A press release from the manufacturer about its newest model", "A tech on a trade forum describing what changed after adding a second lift", "A sales rep telling Dani how popular the machine has been"], "c": 2, "hint": "The key word in the section is \"independent.\"", "why": "A working tech with nothing to sell is an independent voice."}, {"q": "Why does the worksheet ask who is speaking?", "o": ["It decides how long the quote has to be to count as a source", "It tells your reader how much weight the voice deserves", "It lets you replace what they said with what you think they meant", "It is only needed for sources you found on a forum"], "c": 1, "hint": "See \"Ask who is speaking.\"", "why": "A foreman with ten years of experience carries more weight than an anonymous account with one post."}, {"q": "Dani finds a five-star \"review\" on the seller's own website. What is the best way to handle it?", "o": ["Use it as Source 1, since five stars shows the machine is excellent", "Do not count it as independent, and explain why in the rule-out box", "Use it but leave out where it came from so that it looks stronger", "Delete it and use nothing, since Round Three is optional this week"], "c": 1, "hint": "See the paragraph about vendor pages pretending to be reviews.", "why": "The seller picks the testimonials, so it is not an independent voice."}, {"q": "Dani talks to a service manager at another shop. What does Dani write down this week?", "o": ["Who the manager is, how Dani found them, and a note about the conversation", "Only the best parts of what the manager said that help the ask", "A summary of the machine that the manager helped Dani put together", "Nothing, since a conversation cannot be used as a source"], "c": 0, "hint": "See \"Source 2\" in the example.", "why": "Record who it is and how you found them, so the voice is real and ready for Week 3."}, {"q": "What do you do with what the voices actually said?", "o": ["Write it out in full on the worksheet this week", "Leave it out, since opinions do not count in this course", "Save it for Week 3, when you open each source and dig into it", "Replace it with what you think a typical user would say"], "c": 2, "hint": "Read the second paragraph of the section.", "why": "This week you find the voices. Week 3 is where you dig into them."}],
write:{prompt:"Name at least two places or people you could get independent voices from. For each one, note how you would find or reach them and who is speaking.",min:0,use:"Step 5, Round Three"}},

{id:"s6",chip:"Section H: Wrap-Up",title:"What you will do on the worksheet",
body:"<p>This is the end of the Week 2 reading. You now know what to look for and how to find it. The real searching happens on the worksheet. By the time you finish it, you should have a list of every source from your framework and all three rounds. Next week you open each one and dig into it. So the job on the worksheet is to make sure every source is real, saved, and ready.</p>\n<h3>Your source list</h3><p>When you finish the worksheet, you should have:</p>\n<ul>\n<li>The source for your concept from Step 2.</li>\n<li>At least two sources from Round One.</li>\n<li>At least two sources from Round Two.</li>\n<li>At least two sources from Round Three.</li>\n</ul>\n<p>That is at least seven sources, each with a working link or a clear note about who you talked to. If you find more, the worksheet has a button to add them.</p>\n<h3>The rules</h3>\n<ul>\n<li>Every source has a real, working link. If you cannot link to it, you cannot use it.</li>\n<li>Save the link the moment you find it. Do not plan to find it again later. People lose good sources that way.</li>\n<li>Check every link before you use it. Open it in a new tab. Does it load the page you describe?</li>\n<li>AI can help you search, but every source has to be a real page you open and read yourself. AI tools can invent sources that look completely real, with an author, a title, and a believable name. A real-looking citation is not proof. If you cannot open it, it does not exist for this assignment.</li>\n</ul>\n<h3>If you get stuck</h3>\n<ul>\n<li>Change your search words. Try the key words from your framework and pattern, the name of the equipment type, or the name of the trade association in your field.</li>\n<li>Try trade association sites, trade magazines, <a href=\"https://scholar.google.com/\" target=\"_blank\" rel=\"noopener\">Google Scholar</a>, and the <a href=\"https://isu.libguides.com/informationliteracy/findarticles\" target=\"_blank\" rel=\"noopener\">ISU Library</a>.</li>\n<li>Look back at the section for the round you are in. Each one tells you what counts and what does not.</li>\n<li>Ask your instructor. It is better to ask than to guess and use something weak.</li>\n</ul>\n<h3>Where it all goes</h3>\n<p>Your framework and Round One feed the Review of Literature. Rounds Two and Three feed the Methodology. Your problem and ask from Week 1 still start the Introduction. In Week 3 you dig into your sources and put it all together.</p>\n",
goes:"Week 3 is where you dig into every source on this list. Real, working links now save you a lot of trouble then.",
qs:[{"q": "You find a great quote but cannot find the page again. What should you do?", "o": ["Use it anyway, since you remember reading it", "Do not use it, because a source with no working link does not count", "Use it and leave out the link so that no one tries to check it", "Rewrite it in your own words and list the source as \"online\""], "c": 1, "hint": "See the first rule.", "why": "No working link, no source."}, {"q": "An AI tool gives you a source that sounds perfect, with an author and a title. What should you do?", "o": ["Use it, since the author and title make it look real enough", "Use it but change a few words so that it looks like your own find", "Ask the AI to confirm that it is real and trust the answer", "Look for it yourself and use it only if a real page matches exactly"], "c": 3, "hint": "See the rule about AI and real pages.", "why": "AI can invent real-looking sources. You have to open and read it yourself."}, {"q": "When is the best time to save a link?", "o": ["The moment you find the source, before you move on", "At the end of the week when you have all your sources", "Only for sources that end up in the final proposal", "Whenever you are ready to write the Methodology section"], "c": 0, "hint": "See the second rule.", "why": "People lose good sources when they plan to find them again later."}, {"q": "How many sources should be on your list by the end of Week 2?", "o": ["Two, one for each of the first two rounds", "At least seven, including the concept source and at least two for each round", "Twelve, so you have plenty to choose from", "None, because you pick them in Week 3"], "c": 1, "hint": "See \"Your source list.\"", "why": "One for the concept and at least two for each of the three rounds."}, {"q": "Which research feeds the Methodology?", "o": ["Only the framework, since the Methodology is about ideas", "Only Round One, because it documents that the problem exists", "Rounds Two and Three, the numbers and the real voices", "None of it, because the Methodology is written fresh in Week 3"], "c": 2, "hint": "See \"Where it all goes.\"", "why": "The numbers and the real voices are the evidence you gather."}, {"q": "Who writes the Conclusion?", "o": ["You do, with an AI tool checking it for mistakes", "You do, in your own words, and AI does not touch it", "Your instructor, after reading your evidence from the three rounds", "An AI tool does, using the evidence you gathered this week"], "c": 1, "hint": "Look at the \"Where this goes\" box.", "why": "The Conclusion is your judgment, so it is yours alone."}]},

var STATE={name:'',cur:0,unlocked:0,q:{},w:{}};
var KEY='tge1150_m4w2_reading_v1';
try{var sv=localStorage.getItem(KEY);if(sv){var o=JSON.parse(sv);if(o&&o.q)STATE=o;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qKey(i,j){return SECTIONS[i].id+'_'+j;}
function wc(t){var m=(t||'').trim().match(/\S+/g);return m?m.length:0;}
function wDone(i){var s=SECTIONS[i];if(!s.write)return true;return (STATE.w[s.id]||'').trim().length>0;}
function secDone(i){var s=SECTIONS[i];if(s.kind==='start')return !!STATE.name.trim();if(s.kind==='finish')return false;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)return false;}
  return wDone(i);}

function renderProgress(){
  var p=document.getElementById('progress');p.innerHTML='';
  SECTIONS.forEach(function(s,i){var d=document.createElement('div');d.className='dot'+(i===STATE.cur?' cur':(i<STATE.unlocked&&secDone(i)?' done':''));p.appendChild(d);});
  document.getElementById('plabel').textContent='Section '+(STATE.cur+1)+' of '+SECTIONS.length+': '+SECTIONS[STATE.cur].title;
}

function render(){
  var s=SECTIONS[STATE.cur],i=STATE.cur,html='';
  renderProgress();
  if(s.kind==='start'){
    html+='<div class="panel"><span class="chip">Week 2</span><h2>Gathering evidence</h2>';
    html+='<p>This is an interactive reading. It explains each part of the Week 2 Research Worksheet: how to lock in your target, name the pattern behind your problem, and gather evidence in three rounds. You do the real research on the worksheet. This reading is where you learn what it asks and what a strong answer looks like.</p>';
    html+='<h3>How it works</h3><ul><li>Read each section. Each one follows one example person, Dani, so you can see the idea in action.</li><li>Answer the questions. You have to get every one right to move on. If you miss one, the reading tells you where to look, and you try again.</li><li>Most sections end with short notes for your worksheet. Write them about your own situation. Your instructor reads these.</li><li>At the end you print the reading to a PDF and submit it. The PDF shows your answers and your worksheet notes.</li></ul>';
    html+='<label class="l" for="nm">Your first and last name</label><input type="text" id="nm" value="'+esc(STATE.name)+'" placeholder="First Last" autocomplete="name">';
    html+='</div>';
    html+='<div class="nav"><span class="lockmsg" id="lm"></span><button class="btn" id="nx" disabled onclick="go(1)">Start reading</button></div>';
    document.getElementById('stage').innerHTML=html;
    var nm=document.getElementById('nm');
    function chk(){STATE.name=nm.value;persist();var ok=!!nm.value.trim();document.getElementById('nx').disabled=!ok;document.getElementById('lm').textContent=ok?'':'Enter your name to begin.';}
    nm.addEventListener('input',chk);chk();
    return;
  }
  if(s.kind==='finish'){
    html+='<div class="panel"><span class="chip">Finished</span><h2>Finish and submit</h2><p>You read every section, answered every question correctly, and wrote your responses. Here is what you completed:</p>';
    for(var k=1;k<SECTIONS.length-1;k++){html+='<div class="sumrow"><span>'+esc(SECTIONS[k].title)+'</span><span>Complete</span></div>';}
    html+='<h3>What to do now</h3><ul><li>Click <b>Download PDF</b>. Your print window opens. Choose <b>Save as PDF</b> as the destination.</li><li>Submit that PDF for the Week 2 reading assignment.</li><li>Keep your thinking. When you work on the Research Worksheet, you will do the real searching and write your real answers for each step. Your target, your problem, and your equipment are your starting point.</li></ul>';
    html+='<div class="row"><button class="btn" onclick="doPrint()">Download PDF</button></div></div>';
    html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span></span></div>';
    document.getElementById('stage').innerHTML=html;return;
  }
  html+='<div class="panel"><span class="chip">'+esc(s.chip)+'</span><h2>'+esc(s.title)+'</h2>'+s.body;
  if(s.goes)html+='<div class="goes"><b>Where this goes:</b> '+esc(s.goes)+'</div>';
  html+='<div class="check"><h3>Check what you read</h3><p style="font-size:15px;color:var(--muted)">Answer every question correctly to unlock the next part.</p>';
  s.qs.forEach(function(q,j){
    var st=STATE.q[qKey(i,j)]||{};
    html+='<div class="q" data-j="'+j+'"><div class="qt">'+(j+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){var cls='opt'+(st.correct&&k===q.c?' right':'');html+='<button class="'+cls+'" data-k="'+k+'"'+(st.correct?' disabled':'')+'>'+esc(o)+'</button>';});
    html+='<div class="fb'+(st.correct?' ok':' hidden')+'" id="fb'+j+'">'+(st.correct?'Correct. '+esc(q.why):'')+'</div></div>';
  });
  html+='</div>';
  if(s.write){html+='<div class="write"><h3>Notes for your worksheet</h3><p style="font-size:15px;color:var(--muted)">Write notes you will use when you fill out the worksheet. Your own situation, not Dani.</p><p style="font-size:15px;font-weight:600;color:var(--navy)">Use these notes in the worksheet: '+esc(s.write.use)+'.</p><p>'+esc(s.write.prompt)+'</p>'+(s.write.items?'<ul>'+s.write.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'<textarea id="wr" placeholder="Write your notes here."></textarea></div>';}
  html+='</div>';
  html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span class="lockmsg" id="lm"></span><button class="btn" id="nx" onclick="go(1)">'+(i===SECTIONS.length-2?'Finish':'Next section')+'</button></div>';
  document.getElementById('stage').innerHTML=html;
  document.querySelectorAll('.q').forEach(function(qe){
    var j=+qe.getAttribute('data-j');
    qe.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){answer(i,j,+b.getAttribute('data-k'),qe);});});
  });
  if(s.write){var ta=document.getElementById('wr');ta.value=STATE.w[s.id]||'';
    ta.addEventListener('input',function(){STATE.w[s.id]=ta.value;persist();updateNext();});}
  updateNext();
}

function answer(i,j,k,qe){
  var q=SECTIONS[i].qs[j],key=qKey(i,j),st=STATE.q[key]||(STATE.q[key]={attempts:0,correct:false});
  if(st.correct)return;
  st.attempts++;
  var fb=qe.querySelector('.fb'),btns=qe.querySelectorAll('.opt');
  if(k===q.c){
    st.correct=true;
    btns.forEach(function(b){b.disabled=true;if(+b.getAttribute('data-k')===k)b.classList.add('right');b.classList.remove('wrong');});
    fb.className='fb ok';fb.textContent='Correct. '+q.why;
  }else{
    btns.forEach(function(b){b.classList.remove('wrong');if(+b.getAttribute('data-k')===k)b.classList.add('wrong');});
    fb.className='fb no';fb.textContent='Not quite. '+q.hint+' Then try again.';
  }
  persist();updateNext();
}

function updateNext(){
  var i=STATE.cur,s=SECTIONS[i],nx=document.getElementById('nx'),lm=document.getElementById('lm');
  if(!nx||s.kind)return;
  var done=secDone(i),qsDone=true;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)qsDone=false;}
  nx.disabled=!done;
  var msg='';
  if(!qsDone)msg='Answer every question correctly to continue.';
  else if(!wDone(i))msg='Write something in your notes to continue.';
  if(lm)lm.textContent=msg;
  
  if(done&&STATE.unlocked<i+1)STATE.unlocked=i+1;
  renderProgress();
}

function go(d){
  var n=STATE.cur+d;
  if(n<0||n>=SECTIONS.length)return;
  if(d>0&&!secDone(STATE.cur))return;
  STATE.cur=n;if(STATE.unlocked<n)STATE.unlocked=n;
  persist();render();window.scrollTo({top:0,behavior:'smooth'});
}

function buildPrint(){
  var d=new Date().toLocaleDateString();
  var h='<h1>Gathering Evidence: Interactive Reading</h1><div class="pv-meta">TGE 1150 · Module 4 · Week 2<br><b>Name:</b> '+esc(STATE.name)+' &nbsp; <b>Date:</b> '+esc(d)+'</div>';
  for(var i=1;i<SECTIONS.length-1;i++){
    var s=SECTIONS[i];h+='<div class="pv-sec"><h4>'+esc(s.chip)+': '+esc(s.title)+'</h4>';
    s.qs.forEach(function(q,j){var st=STATE.q[qKey(i,j)]||{attempts:0};h+='<div class="pv-q">'+(j+1)+'. '+esc(q.q)+'<br><i>Answer: '+esc(q.o[q.c])+' (correct on attempt '+st.attempts+')</i></div>';});
    if(s.write){h+='<div class="pv-q pv-w"><b>Worksheet notes (for the Research Worksheet, '+esc(s.write.use)+'):</b> '+esc(s.write.prompt)+(s.write.items?'<ul>'+s.write.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'</div><div class="pv-r">'+esc(STATE.w[s.id]||'')+'</div>';}
    h+='</div>';
  }
  h+='<div class="pv-attest">I read each section, answered every question, and wrote my responses in my own words. Signed: '+esc(STATE.name)+'</div>';
  document.getElementById('printView').innerHTML=h;
}
function doPrint(){buildPrint();window.print();}
window.addEventListener('beforeprint',buildPrint);
render();
</script>
</body>
</html>
